name: Focused iOS 27.2 RC UIKit visual validation

on:
  push:
    branches: [codex/ios27-visual-20261022]

permissions:
  contents: read

# This group is independent of the production IPA workflow and its iOS 26 run.
concurrency:
  group: ios27-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  visual:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Official 20261019 image path. An older image must fail explicitly.
      DEVELOPER_DIR: /Applications/Xcode_27.2_beta_3.app/Contents/Developer
      CLEAR_RC_VERSION: '27.2'
      CLEAR_RC_BUILD: '24B114'
      CLEAR_RC_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
      CLEAR_VISUAL_OUT: .build/ios27-visual
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select and record an actually installed Xcode 27.2 toolchain
        run: |
          set -euo pipefail
          mkdir -p "$CLEAR_VISUAL_OUT"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['CLEAR_VISUAL_OUT'])
          candidates = sorted(pathlib.Path('/Applications').glob('Xcode*27.2*.app/Contents/Developer'), reverse=True)
          inspected = []
          for path in candidates:
              result = subprocess.run(['/usr/bin/xcodebuild', '-version'],
                  env={**os.environ, 'DEVELOPER_DIR': str(path)}, capture_output=True, text=True, timeout=60)
              inspected.append({'path': str(path), 'exitCode': result.returncode,
                                'version': result.stdout, 'stderr': result.stderr})
          (out / 'installed-xcode-27-2.json').write_text(json.dumps(inspected, indent=2))
          supported = [x for x in inspected if x['exitCode'] == 0 and x['version'].startswith('Xcode 27.2\n')]
          assert supported, 'No installed Xcode 27.2 toolchain; no older SDK substitution is allowed'
          selected = supported[0]
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('DEVELOPER_DIR=' + selected['path'] + '\n')
          print(json.dumps({'selectedToolchain': selected, 'exactRuntimeStillRequired': '27.2 / 24B114'}, indent=2))
          PY

      - name: Record exact source, hosted image, toolchain and initial disk space
        run: |
          set -euo pipefail
          mkdir -p "$CLEAR_VISUAL_OUT"
          git rev-parse HEAD > "$CLEAR_VISUAL_OUT/source-commit.txt"
          git status --porcelain=v1 > "$CLEAR_VISUAL_OUT/source-status-before.txt"
          sw_vers > "$CLEAR_VISUAL_OUT/macos.txt"
          uname -a > "$CLEAR_VISUAL_OUT/host.txt"
          df -h . /Applications > "$CLEAR_VISUAL_OUT/disk-before.txt"
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee "$CLEAR_VISUAL_OUT/xcode-version.txt"
          xcodebuild -showsdks > "$CLEAR_VISUAL_OUT/sdks.txt"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          out = pathlib.Path(os.environ['CLEAR_VISUAL_OUT'])
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
                    for p in files if p and pathlib.Path(p).is_file()}
          info = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'developerDirectory': os.environ['DEVELOPER_DIR'],
                  'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion'),
                  'runnerOS': os.environ.get('RUNNER_OS'), 'runnerArch': os.environ.get('RUNNER_ARCH'),
                  'runtimeVersionRequired': os.environ['CLEAR_RC_VERSION'],
                  'runtimeBuildRequired': os.environ['CLEAR_RC_BUILD'],
                  'freeBytesBeforeDownload': shutil.disk_usage('.').free,
                  'scope': 'Eight UIKit fixture tests; no model evaluation, IPA or remote extension host claim',
                  'sha256': hashes}
          (out / 'source-and-environment.json').write_text(json.dumps(info, indent=2))
          # Download is 8.32 GB. Additional installed/runtime/build space is measured,
          # never inferred from GitHub's advertised 14 GB storage specification.
          assert info['freeBytesBeforeDownload'] >= 12 * 1024**3, 'Less than 12 GiB free before RC runtime download'
          PY

      - name: Verify public RC catalog entry and install that exact ARM64 runtime
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, plistlib, urllib.request
          url = 'https://devimages-cdn.apple.com/downloads/xcode/simulators/index2.dvtdownloadableindex'
          data = plistlib.loads(urllib.request.urlopen(url, timeout=60).read())
          matches = [x for x in data['downloadables']
                     if x.get('simulatorVersion', {}).get('version') == os.environ['CLEAR_RC_VERSION']
                     and x.get('simulatorVersion', {}).get('buildUpdate') == os.environ['CLEAR_RC_BUILD']
                     and 'arm64' in x.get('architectures', [])
                     and x.get('platform') == 'com.apple.platform.iphoneos']
          assert len(matches) == 1, 'The exact iOS 27.2 RC ARM64 catalog entry is unavailable or ambiguous'
          entry = matches[0]
          assert entry.get('authentication') == 'none'
          assert 'Release Candidate' in entry.get('name', '')
          out = pathlib.Path(os.environ['CLEAR_VISUAL_OUT'])
          (out / 'apple-runtime-catalog-entry.json').write_text(json.dumps({'catalogURL': url, 'entry': entry}, indent=2))
          print(json.dumps(entry, indent=2), flush=True)
          PY
          xcodebuild -runFirstLaunch 2>&1 | tee "$CLEAR_VISUAL_OUT/first-launch.log"
          # Do not export a second copy of the 8.32 GB image; use Apple's installer.
          xcodebuild -downloadPlatform iOS -buildVersion "$CLEAR_RC_BUILD" -architectureVariant arm64 \
            2>&1 | tee "$CLEAR_VISUAL_OUT/runtime-download.log"
          df -h . > "$CLEAR_VISUAL_OUT/disk-after-runtime.txt"

      - name: Select or create iPhone Air and strictly prove the RC runtime is running
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, plistlib, shutil, subprocess, sys, time, uuid
          out = pathlib.Path(os.environ['CLEAR_VISUAL_OUT'])
          def run(*args, timeout=60):
              result = subprocess.run(['xcrun', 'simctl', *args], capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError('simctl ' + ' '.join(args) + '\n' + result.stdout + result.stderr)
              return result.stdout
          def inventory(kind):
              for attempt in range(3):
                  try:
                      raw = run('list', kind, '-j', timeout=60)
                      (out / ('simctl-' + kind + '.json')).write_text(raw)
                      return json.loads(raw)
                  except (subprocess.TimeoutExpired, RuntimeError, json.JSONDecodeError):
                      if attempt == 2: raise
                      time.sleep(3)
          runtimes = inventory('runtimes')['runtimes']
          matches = [r for r in runtimes if r.get('identifier') == os.environ['CLEAR_RC_RUNTIME']
                     and r.get('version') == os.environ['CLEAR_RC_VERSION']
                     and (r.get('buildversion') or r.get('buildVersion')) == os.environ['CLEAR_RC_BUILD']
                     and r.get('isAvailable')]
          assert len(matches) == 1, 'No available exact 27.2 RC runtime; SDK presence does not satisfy this check'
          runtime = matches[0]
          devices = inventory('devices')['devices'].get(runtime['identifier'], [])
          choices = [d for d in devices if d.get('isAvailable') and d.get('name') == 'iPhone Air']
          created = not choices
          if choices:
              device = choices[0]['udid']
          else:
              types = inventory('devicetypes')['devicetypes']
              air = next(t for t in types if t['name'] == 'iPhone Air')
              device = run('create', 'ClearKeyboard iOS 27.2 RC Air', air['identifier'], runtime['identifier']).strip()
          uuid.UUID(device)
          (out / 'device-id.txt').write_text(device)
          # A Booted state is not proof of a responsive UI on a freshly installed
          # runtime. Use the same bounded boot plus live-service probes as the
          # production CI, locked to this exact runtime with no 27.0 fallback.
          boot_env = {**os.environ, 'CLEAR_TEST_SIMULATOR_RUNTIME': runtime['identifier'],
                      'CLEAR_TEST_REQUIRE_RUNTIME': '1', 'CLEAR_TEST_REQUIRED_RUNTIME_MAJOR': ''}
          with (out / 'boot-readiness.log').open('w') as log:
              completed = subprocess.run([sys.executable, 'Scripts/boot_test_simulator.py'],
                  env=boot_env, stdout=log, stderr=subprocess.STDOUT, timeout=570)
          assert completed.returncode == 0, 'Exact RC UI service readiness failed; inspect boot-readiness.log'
          device = pathlib.Path('.build/composition-device-id').read_text().strip(); uuid.UUID(device)
          (out / 'device-id.txt').write_text(device)
          board = run('spawn', device, 'launchctl', 'print', 'system/com.apple.SpringBoard')
          (out / 'springboard.txt').write_text(board)
          assert 'state = running' in board
          apps = run('listapps', device)
          (out / 'simulator-apps.plist').write_text(apps)
          converted = subprocess.check_output(['/usr/bin/plutil', '-convert', 'json', '-o', '-', '--', '-'], input=apps, text=True)
          assert 'com.apple.Preferences' in json.loads(converted)
          run('io', device, 'screenshot', str(out / 'rc-readiness.png'))
          assert (out / 'rc-readiness.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          # Validate the booted device's runtime association and the runtime's
          # SystemVersion file, without assuming macOS sw_vers exists on iOS.
          booted_devices = inventory('devices')['devices'].get(runtime['identifier'], [])
          assert any(d.get('udid') == device and d.get('state') == 'Booted' for d in booted_devices)
          version_path = pathlib.Path(runtime['bundlePath']) / 'Contents/Resources/RuntimeRoot/System/Library/CoreServices/SystemVersion.plist'
          version_info = plistlib.loads(version_path.read_bytes())
          booted_version = version_info['ProductVersion']
          booted_build = version_info['ProductBuildVersion']
          (out / 'runtime-SystemVersion.json').write_text(json.dumps(version_info, indent=2))
          assert booted_version == os.environ['CLEAR_RC_VERSION'], booted_version
          assert booted_build == os.environ['CLEAR_RC_BUILD'], booted_build
          metadata = {'runtime': runtime, 'device': device, 'deviceWasCreated': created,
                      'bootedProductVersion': booted_version, 'bootedBuildVersion': booted_build,
                      'springboardRunning': True, 'preferencesInstalled': True, 'screenshotRendered': True,
                      'freeBytesAfterRuntimeBoot': shutil.disk_usage('.').free}
          (out / 'verified-running-runtime.json').write_text(json.dumps(metadata, indent=2))
          assert metadata['freeBytesAfterRuntimeBoot'] >= 2 * 1024**3, 'Less than 2 GiB left for the focused build'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CLEAR_RC_DEVICE=' + device + '\n')
          print(json.dumps(metadata, indent=2), flush=True)
          PY

      - name: Prepare only missing resource placeholders and the normal project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, struct
          # Candidate rows are supplied directly by fixtures; the two root tests
          # inspect rendering and geometry without asserting neural engine readiness.
          # Keep the production Swift/C++ sources and pinned RimeStatic link intact.
          resources = pathlib.Path('Core/Resources')
          rime = resources / 'Rime'; rime.mkdir(parents=True, exist_ok=True)
          (rime / 'UI_FIXTURE_ONLY.txt').write_text('No neural language resources are prepared in this visual-only job.\n')
          placeholders = []
          path = resources / 'associations.clx'
          if not path.exists():
              path.write_bytes(b'CLRX0001' + struct.pack('<6I', 0, 0, 32, 32, 32, 32))
              placeholders.append({'file': path.as_posix(), 'kind': 'valid empty CLRX associations'})
          path = resources / 'pinyin-corrections.clx'
          if not path.exists():
              # This absent-data marker is intentionally not a correction index.
              # InputEngine.bundled rejects it safely before Rime initialization;
              # UIKit fixtures do not require or assert a working decoder.
              path.write_bytes(b'UI_FIXTURE_NO_CORRECTION_INDEX\n')
              placeholders.append({'file': path.as_posix(), 'kind': 'explicit unavailable correction-index marker'})
          for name in ['pinyin.clx', 'english.clx']:
              assert (resources / name).is_file(), 'Tracked dictionary is missing: ' + name
          info = {'missingOnlyResourcePlaceholders': placeholders, 'rimeModelPrepared': False,
                  'files': {p.as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                            for p in resources.rglob('*') if p.is_file()}}
          (pathlib.Path(os.environ['CLEAR_VISUAL_OUT']) / 'visual-resource-scope.json').write_text(json.dumps(info, indent=2))
          PY
          python3 Scripts/generate_project.py

      - name: Run exactly six candidate and two root UIKit tests on iOS 27.2 RC
        timeout-minutes: 18
        run: |
          set -euo pipefail
          selectors=(
            CandidateAnimationRuntimeTests/testNewInkIsReadableImmediatelyWithoutOldWordOverprint
            CandidateAnimationRuntimeTests/testRapidResultsShareOneClockAndKeepLatestTextAndExactHitGeometry
            CandidateAnimationRuntimeTests/testReduceMotionSettlesAnUnchangedWordAndNeverStartsAnotherTransition
            CandidateAnimationRuntimeTests/testIntermediateEmptyAndSupersededRowsCoalesceWithoutHidingTheCurrentInk
            CandidateAnimationRuntimeTests/testAppendingWhileBrowsingKeepsControlPositionsOffsetAndSelectableContext
            CandidateAnimationRuntimeTests/testCandidateHandoffVisualSamplesAndSettledInk
            KeyboardRuntimeTests/testRootBackdropCoversExtraHostHeightWithoutChangingKeyGeometry
            KeyboardRuntimeTests/testPublicResponderHostedInputViewPaintsItsOwnBoundsInBothStyles
          )
          printf '%s\n' "${selectors[@]}" > "$CLEAR_VISUAL_OUT/selected-tests.txt"
          arguments=()
          for selector in "${selectors[@]}"; do arguments+=("-only-testing:ClearKeyboardRuntimeTests/$selector"); done
          xcodebuild -project ClearKeyboard.xcodeproj -scheme ClearKeyboardRuntime \
            -configuration Debug -destination "platform=iOS Simulator,id=$CLEAR_RC_DEVICE" \
            -derivedDataPath .build/IOS27VisualBuild -resultBundlePath "$CLEAR_VISUAL_OUT/VisualResults.xcresult" \
            -destination-timeout 60 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 \
            "${arguments[@]}" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test 2>&1 | tee "$CLEAR_VISUAL_OUT/xcodebuild-test.log"
          xcrun xcresulttool get test-results summary --path "$CLEAR_VISUAL_OUT/VisualResults.xcresult" \
            > "$CLEAR_VISUAL_OUT/test-summary.json"
          python3 - <<'PY'
          import json, os, pathlib
          summary = json.loads((pathlib.Path(os.environ['CLEAR_VISUAL_OUT']) / 'test-summary.json').read_text())
          assert summary['totalTestCount'] == 8, summary
          assert summary['passedTests'] == 8 and summary['failedTests'] == 0 and summary['skippedTests'] == 0, summary
          print('IOS27_RC_FOCUSED_UIKIT_CHECKS passed=8; remoteExtensionHostVerified=false; physicalPhoneVerified=false')
          PY

      - name: Export visual attachments, diagnostics and final environment metadata
        if: always()
        run: |
          set +e
          mkdir -p "$CLEAR_VISUAL_OUT"
          bundle="$CLEAR_VISUAL_OUT/VisualResults.xcresult"
          if [ -d "$bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$bundle" > "$CLEAR_VISUAL_OUT/test-summary.json"
            xcrun xcresulttool get test-results tests --path "$bundle" > "$CLEAR_VISUAL_OUT/test-results.json"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$CLEAR_VISUAL_OUT/attachments" \
              > "$CLEAR_VISUAL_OUT/attachments-export.log" 2>&1
            xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$CLEAR_VISUAL_OUT/diagnostics" \
              > "$CLEAR_VISUAL_OUT/diagnostics-export.log" 2>&1
          fi
          xcrun simctl list runtimes -j > "$CLEAR_VISUAL_OUT/runtimes-after.json" 2>&1
          if [ -n "${CLEAR_RC_DEVICE:-}" ]; then
            xcrun simctl io "$CLEAR_RC_DEVICE" screenshot "$CLEAR_VISUAL_OUT/after-tests.png"
            xcrun simctl spawn "$CLEAR_RC_DEVICE" log show --last 5m --style compact \
              --predicate 'process == "ClearKeyboard" OR subsystem == "ClearKeyboard"' \
              > "$CLEAR_VISUAL_OUT/simulator-keyboard.log" 2>&1
            xcrun simctl shutdown "$CLEAR_RC_DEVICE"
          fi
          git status --porcelain=v1 > "$CLEAR_VISUAL_OUT/source-status-after.txt"
          df -h . > "$CLEAR_VISUAL_OUT/disk-final.txt"
          exit 0

      - name: Preserve iOS 27.2 RC UIKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-2-rc-uikit-${{ github.run_id }}
          path: .build/ios27-visual/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

