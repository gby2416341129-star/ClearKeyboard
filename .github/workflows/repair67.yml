name: Build 79 responsive low-duty Qwen IPA
on:
  push:
    branches: [codex/repair67-20261026]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Qwen runtime, App and keyboard, verify model, package IPA
        run: bash Scripts/build-ipa.sh dist
      - name: Return IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-unsigned-IPA
          path: |
            dist/ClearKeyboard-unsigned.ipa
            dist/ClearKeyboard-unsigned.ipa.sha256
          compression-level: 0
          retention-days: 7
