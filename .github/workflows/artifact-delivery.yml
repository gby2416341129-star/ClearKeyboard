name: Deliver existing v5 IPA in smaller parts
on:
  workflow_dispatch:
  push:
    branches: [npu/qwen35-08b-calibrated-q4]
    paths: ['.github/workflows/artifact-delivery.yml']
permissions:
  contents: read
  actions: read
jobs:
  repackage-existing-ipa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ANEProbe-Q4-v5-IPA-part00
          path: delivery
          run-id: 40451611063
          github-token: ${{ github.token }}
      - name: Split the existing IPA part without rebuilding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('delivery/ANEProbe-Q4-v5-unsigned.ipa.part00')
          with source.open('rb') as handle:
              for suffix in ['a', 'b']:
                  Path(str(source) + suffix).write_bytes(handle.read(200 * 1024 * 1024))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ANEProbe-Q4-v5-IPA-part00a
          path: delivery/ANEProbe-Q4-v5-unsigned.ipa.part00a
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ANEProbe-Q4-v5-IPA-part00b
          path: delivery/ANEProbe-Q4-v5-unsigned.ipa.part00b
          compression-level: 0
          retention-days: 7

