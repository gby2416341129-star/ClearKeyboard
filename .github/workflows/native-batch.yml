name: Validate cached causal whole scoring
on:
  push:
    branches: [codex/ime-native-batch-20261021]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numeric-and-cost:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore unchanged pinned weights and shipping build41 reference
        run: |
          python3 Scripts/prepare_ime_model.py
          mkdir -p .build
          python3 - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          data=urllib.request.urlopen('https://raw.githubusercontent.com/gby2416341129-star/ClearKeyboard/c0f36661b34567af19d7ff52fa9562531eae6cdc/CRime/private/clear_sentence.h',timeout=60).read()
          assert hashlib.sha256(data).hexdigest()=='696c07cdc5aaa2982b570e9fc6abebdd54d1cf6620e6698576f6f062bd3e1652'
          Path('.build/whole-reference.h').write_bytes(data)
          PY
      - name: Compare complete probabilities, cache eviction, cancellation and incremental CPU cost
        run: |
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_whole_cache.cpp -o .build/test-whole-cache
          .build/test-whole-cache Core/Resources/Rime/clear-sentence.clm
      - name: Compile cached scorer for the actual generic iPhone target
        run: |
          xcrun --sdk iphoneos clang++ -O3 -std=c++17 -arch arm64 -miphoneos-version-min=18.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -x c++ -c CRime/private/clear_sentence_cached.h -o .build/cached-scorer-iphone.o
