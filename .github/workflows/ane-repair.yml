name: Build iPhone runtime load recovery with unchanged v4 models
on:
  workflow_dispatch:
  push:
    branches: [npu/qwen35-08b-calibrated-q4]
    paths: ['.github/workflows/ane-repair.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: iphone-ane-direct-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-probe:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MODEL_DIRECTORY: work/baseline/Payload/ANEProbe.app/Qwen3.5-0.8B-IME-Q4
      COMPILED_MODEL_DIRECTORY: work/baseline/Payload/ANEProbe.app
      BUILD_REVISION: '10-v4-models-explicit-all-load-recovery'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ANEProbe-Q4-v4-IPA-part00
          path: work/baseline-parts
          run-id: 40450122478
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ANEProbe-Q4-v4-IPA-part01
          path: work/baseline-parts
          run-id: 40450122478
          github-token: ${{ github.token }}
      - name: Recover exact v4 compiled models without model conversion or tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile
          parts = Path('work/baseline-parts')
          ipa = Path('work/baseline-v4.ipa')
          with ipa.open('wb') as output:
              for index in range(2):
                  with (parts / f'ANEProbe-Q4-v4-unsigned.ipa.part{index:02d}').open('rb') as source:
                      shutil.copyfileobj(source, output, 8 * 1024 * 1024)
          with ipa.open('rb') as handle:
              assert hashlib.file_digest(handle, 'sha256').hexdigest() == '840e2cdffa18072a87002688b3145439c9633750d96282fbe84e1ca03644850d'
          with zipfile.ZipFile(ipa) as archive:
              archive.extractall('work/baseline')
          info = json.loads(Path('work/baseline/Payload/ANEProbe.app/Qwen3.5-0.8B-IME-Q4/model-info.json').read_text())
          assert info['fingerprint'] == '5f4aaef5ee436de73cb474bed299f632597554af78c71cfc88117927615b43e7'
          PY
      - name: Compile and package runtime only; all execution tests belong to the user
        run: |
          set -euo pipefail
          mkdir -p work/artifacts
          xcodebuild -version > work/artifacts/apple-toolchain.txt
          bash Scripts/build_probe.sh 2>&1 | tee work/artifacts/xcodebuild.log
          mkdir -p work/ipa/Payload
          ditto work/build/Build/Products/Release-iphoneos/ANEProbe.app work/ipa/Payload/ANEProbe.app
          cd work/ipa
          ditto -c -k --keepParent Payload ../artifacts/ANEProbe-Q4-v8-unsigned.ipa
      - name: Package delivery pieces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('work/artifacts')
          ipa = root / 'ANEProbe-Q4-v8-unsigned.ipa'
          parts = []
          with ipa.open('rb') as handle:
              for index in range(4):
                  data = handle.read(200 * 1024 * 1024)
                  part = root / f'ANEProbe-Q4-v8-unsigned.ipa.part{index:02d}'
                  part.write_bytes(data)
                  parts.append({'file': part.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
              assert not handle.read(1), 'IPA exceeds delivery capacity'
          with ipa.open('rb') as handle:
              sha = hashlib.file_digest(handle, 'sha256').hexdigest()
          (root / 'ipa-delivery.json').write_text(json.dumps({'parts': parts, 'ipaSHA256': sha}, indent=2))
          (root / 'STATUS.txt').write_text('Exact Build 4 compiled models, Build 7 prefix checkpoints, Build 8 whole-group all-to-CPU+ANE load recovery. Requested/effective configurations and native attempt errors are recorded separately. No inference, performance, accuracy or regression tests executed. User performs all execution tests.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ANEProbe-Q4-v8-IPA-part00
          path: work/artifacts/ANEProbe-Q4-v8-unsigned.ipa.part00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ANEProbe-Q4-v8-IPA-part01
          path: work/artifacts/ANEProbe-Q4-v8-unsigned.ipa.part01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ANEProbe-Q4-v8-IPA-part02
          path: work/artifacts/ANEProbe-Q4-v8-unsigned.ipa.part02
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ANEProbe-Q4-v8-IPA-part03
          path: work/artifacts/ANEProbe-Q4-v8-unsigned.ipa.part03
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ANEProbe-Q4-v8-diagnostics
          path: |
            work/artifacts/*.log
            work/artifacts/*.json
            work/artifacts/*.txt
          retention-days: 7
