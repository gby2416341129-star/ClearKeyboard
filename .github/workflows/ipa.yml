name: Build unsigned iPhone IPA

on:
  push:
    branches: [main, codex/ime-coreml-eval-20261020, codex/ime-full-optimization-20261020]
    paths-ignore:
      - 'UITests/**'
      - 'Scripts/test-candidates-ui.sh'
      - 'Scripts/test-candidate-gestures.sh'
      - '.github/workflows/candidate-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CLEAR_UI_HOTFIX: '1'
      CLEAR_VISUAL_FAST: '1'
      # Build 63: run focused native regressions; the owner reviews the IPA on device.
      CLEAR_USER_DEVICE_REVIEW: '1'
      CLEAR_TEST_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-4
      CLEAR_TEST_REQUIRED_RUNTIME_MAJOR: '26'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify keyboard interaction and appearance repair scope
        if: env.CLEAR_UI_HOTFIX == '1'
        run: |
          git fetch --no-tags --depth=1 origin fed2ef08404cd5b0f252a798922e884d4868655b
          python3 Scripts/verify_ui_hotfix.py
      - name: Reproduce the expiring composition ledger and check the repair
        if: env.CLEAR_UI_HOTFIX != '1'
        run: |
          mkdir -p .build
          python3 - <<'PY'
          import hashlib,json,subprocess,urllib.request
          from pathlib import Path
          source=urllib.request.urlopen('https://raw.githubusercontent.com/gby2416341129-star/ClearKeyboard/631d0624a68208e88de18e907f4adf051053ab0f/Core/HostTextState.swift',timeout=60).read()
          assert hashlib.sha256(source).hexdigest()=='56c1251c0fb00861f6b7f213caddb1f6fe694f529744f13883a805e688eebde6'
          Path('.build/HostTextState44.swift').write_bytes(source)
          subprocess.run(['swiftc','-O','-parse-as-library','.build/HostTextState44.swift','Scripts/test_composition_ownership.swift','-o','.build/test-composition-before'],check=True)
          result=subprocess.run(['.build/test-composition-before'],capture_output=True,text=True)
          report=json.loads(result.stdout.strip())
          assert result.returncode!=0 and report['failed']>0, 'The regression must reproduce against the delivered source'
          print('BUILD44_COMPOSITION_REGRESSION '+json.dumps(report,ensure_ascii=False),flush=True)
          subprocess.run(['swiftc','-O','-parse-as-library','.build/HostTextState44.swift','Scripts/test_edit_transactions.swift','-o','.build/test-edits-before'],check=True)
          result=subprocess.run(['.build/test-edits-before'],capture_output=True,text=True)
          report=json.loads(result.stdout.strip())
          assert result.returncode!=0 and report['failed']>0, 'Editing checks must catch the delivered append-after-marked defect'
          print('BUILD44_EDIT_TRANSACTION_REGRESSION '+json.dumps(report,ensure_ascii=False),flush=True)
          source=urllib.request.urlopen('https://raw.githubusercontent.com/gby2416341129-star/ClearKeyboard/631d0624a68208e88de18e907f4adf051053ab0f/Core/Composition.swift',timeout=60).read()
          assert hashlib.sha256(source).hexdigest()=='41150402693b8faa7465b194a46c96fcd782e7af4af9eb3acd07e843b93b00f2'
          Path('.build/Composition44.swift').write_bytes(source)
          subprocess.run(['swiftc','-O','-parse-as-library','Core/Lexicon.swift','Core/FuzzyPinyin.swift','.build/Composition44.swift','.build/HostTextState44.swift','Scripts/test_long_draft.swift','-o','.build/test-long-draft-before'],check=True)
          result=subprocess.run(['.build/test-long-draft-before'],capture_output=True,text=True)
          report=json.loads(result.stdout.strip())
          assert result.returncode!=0 and report['failed']>0, 'Long typing must cross the old draft limit and marked-context truncation'
          print('BUILD44_LONG_DRAFT_REGRESSION '+json.dumps(report,ensure_ascii=False),flush=True)
          PY
          swiftc -O -parse-as-library Core/HostTextState.swift Scripts/test_composition_ownership.swift -o .build/test-composition-ownership
          .build/test-composition-ownership
          swiftc -O -parse-as-library Core/HostTextState.swift Scripts/test_edit_transactions.swift -o .build/test-edit-transactions
          .build/test-edit-transactions
          swiftc -O -parse-as-library Core/Lexicon.swift Core/FuzzyPinyin.swift Core/Composition.swift Core/HostTextState.swift Scripts/test_long_draft.swift -o .build/test-long-draft
          .build/test-long-draft
          swiftc -O -parse-as-library Core/Lexicon.swift Core/FuzzyPinyin.swift Core/Composition.swift Core/HostTextState.swift Scripts/test_input_core.swift -o .build/test-input-core
          .build/test-input-core
          swiftc -O -parse-as-library Core/Candidate.swift Core/Lexicon.swift Core/FuzzyPinyin.swift Core/Composition.swift Core/PersonalLexicon.swift Core/NumericLexicon.swift Scripts/test_personal_learning.swift -o .build/test-personal-learning
          .build/test-personal-learning
      - name: Restore pinned language model cache
        id: language-model
        uses: actions/cache/restore@v4
        with:
          path: .rime-cache/wanxiang-lts-zh-hans.gram
          key: wanxiang-model-1849e5e4acbdbfaf41fceeb86b739d5d0c85d574bd8a688562cba1e6beb78488
      - name: Recover and verify the same model used in the previous IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/restore_pinned_model.py
      - name: Cache verified pinned model
        if: steps.language-model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .rime-cache/wanxiang-lts-zh-hans.gram
          key: wanxiang-model-1849e5e4acbdbfaf41fceeb86b739d5d0c85d574bd8a688562cba1e6beb78488
      - name: Prepare verified offline Chinese engine and language model
        run: |
          python3 Scripts/test_prepare_rime.py
          python3 Scripts/test_conversation_index.py
          python3 Scripts/prepare_rime.py
      - name: Compile iOS sources and test hosts before model evaluation
        if: env.CLEAR_VISUAL_FAST != '1'
        run: |
          mkdir -p .build
          swiftc SharedUI/BrandMaterial.swift Scripts/prepare_app_icon.swift -o .build/prepare-app-icon
          .build/prepare-app-icon
          python3 Scripts/generate_project.py
          xcodebuild -quiet -project ClearKeyboard.xcodeproj -scheme ClearKeyboardRuntime -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/Composition CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing
      - name: Preserve the prepared icon source
        if: env.CLEAR_VISUAL_FAST != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-icon-source-review
          path: .build/IconSourceReview
          if-no-files-found: ignore
          retention-days: 7
      - name: Start the required iOS 26 simulator and verify UI services
        if: env.CLEAR_VISUAL_FAST != '1'
        run: python3 Scripts/boot_test_simulator.py
      - name: Check native composition and preview before the longer suites
        if: env.CLEAR_VISUAL_FAST != '1'
        run: |
          TEST_DEVICE="$(cat .build/composition-device-id)"
          set +e
          xcodebuild -quiet -project ClearKeyboard.xcodeproj -scheme ClearKeyboardRuntime \
            -configuration Debug -destination "platform=iOS Simulator,id=$TEST_DEVICE" \
            -derivedDataPath .build/Composition -resultBundlePath .build/SolidBoundaryResults.xcresult \
            -destination-timeout 60 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 \
            -only-testing:ClearKeyboardRuntimeTests/KeyboardRuntimeTests/testAppearancePreviewUsesOneUniformlyScaledKeyboardCanvas \
            -only-testing:ClearKeyboardRuntimeTests/KeyboardRuntimeTests/testToolbarArtworkHasMatchingVisibleFootprints \
            -only-testing:ClearKeyboardRuntimeTests/GlassDesignRuntimeTests/testUnifiedGlassScreensAtPhoneSizeInLightAndDark \
            -only-testing:ClearKeyboardRuntimeTests/UnifiedRepairTests/testRecentClipboardCanPasteAndOpenHistoryWithoutReplacingTypedPinyin \
            -only-testing:ClearKeyboardRuntimeTests/UnifiedRepairTests/testCustomKeyTintAndInkStayVisibleAtZeroGlassStrength \
            -only-testing:ClearKeyboardRuntimeTests/AppearanceReceiverRuntimeTests/testIndependentAppMaterialSwitchesChangeActualKeyboardPixels \
            -only-testing:ClearKeyboardRuntimeTests/CandidateAnimationRuntimeTests/testCandidateHandoffVisualSamplesAndSettledInk \
            -only-testing:ClearKeyboardRuntimeTests/CandidateAnimationRuntimeTests/testRapidResultsShareOneClockAndKeepLatestTextAndExactHitGeometry \
            -only-testing:ClearKeyboardRuntimeTests/RemoteProxyPerformanceTests/testNativeDraftSurvivesTransientNilContextWithoutLosingChineseCandidates \
            -only-testing:ClearKeyboardRuntimeTests/RemoteProxyPerformanceTests/testPartialConversionWithRealUITextFieldSurvivesIdleAndSelectionCallbacks \
            -only-testing:ClearKeyboardRuntimeTests/RemoteProxyPerformanceTests/testPartialConversionWithRealUITextViewSurvivesIdleAndSelectionCallbacks \
            -only-testing:ClearKeyboardRuntimeTests/RemoteProxyPerformanceTests/testPartialConversionInTheAppsActualSwiftUIAppearanceFieldSurvivesIdle \
            -only-testing:ClearKeyboardRuntimeTests/RemoteProxyPerformanceTests/testConfirmCommitsExactRawSpellingWithoutWaitingForCandidates \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test-without-building
          RESULT=$?
          xcrun xcresulttool get test-results summary --path .build/SolidBoundaryResults.xcresult || true
          xcrun xcresulttool get test-results tests --path .build/SolidBoundaryResults.xcresult || true
          if [ "$RESULT" -ne 0 ]; then
            xcrun xcresulttool get test-results activities --path .build/SolidBoundaryResults.xcresult --test-id 'CandidateAnimationRuntimeTests/testRapidResultsShareOneClockAndKeepLatestTextAndExactHitGeometry()' || true
            xcrun xcresulttool get test-results activities --path .build/SolidBoundaryResults.xcresult --test-id 'CandidateAnimationRuntimeTests/testCandidateHandoffVisualSamplesAndSettledInk()' || true
          fi
          exit "$RESULT"
      - name: Preserve the focused appearance result
        if: env.CLEAR_VISUAL_FAST != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-appearance-smoke-diagnostic
          path: .build/SolidBoundaryResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Check redesigned app scrolling before the longer suites
        if: env.CLEAR_VISUAL_FAST != '1'
        run: |
          TEST_DEVICE="$(cat .build/composition-device-id)"
          set +e
          xcodebuild -quiet -project ClearKeyboard.xcodeproj -scheme ClearKeyboardUI \
            -configuration Debug -destination "platform=iOS Simulator,id=$TEST_DEVICE" \
            -derivedDataPath .build/Composition -resultBundlePath .build/AppNavigationResults.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
            -only-testing:ClearKeyboardUITests/AppUITests/testEveryTabCanScrollItsLastControlAboveTheBottomBar \
            -only-testing:ClearKeyboardUITests/AppUITests/testAppearanceKeyGlass \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test
          RESULT=$?
          xcrun xcresulttool get test-results summary --path .build/AppNavigationResults.xcresult
          if [ "$RESULT" -ne 0 ]; then
            xcrun xcresulttool get test-results activities --path .build/AppNavigationResults.xcresult --test-id 'AppUITests/testEveryTabCanScrollItsLastControlAboveTheBottomBar()' || true
          fi
          exit "$RESULT"
      - name: Preserve the app navigation diagnostic
        if: env.CLEAR_VISUAL_FAST != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-navigation-smoke-diagnostic
          path: .build/AppNavigationResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile the pinned Core ML model for the Apple accelerator
        run: |
          python3 -m pip install --disable-pip-version-check 'coremltools==9.0' 'numpy==2.2.6' 'protobuf==5.29.5'
          python3 Scripts/export_ime_shared.py
          if [[ "$CLEAR_UI_HOTFIX" != '1' ]]; then
          python3 Scripts/validate_ime_shared.py
          python3 Scripts/test_ime_model.py
          swiftc -O -parse-as-library Core/CoreMLPrefixState.swift Scripts/test_coreml_prefix.swift -o .rime-cache/test-coreml-prefix
          .rime-cache/test-coreml-prefix Core/Resources/Rime
          swiftc -O -target "$(uname -m)-apple-macos15.0" -parse-as-library Core/CoreMLCandidateScorer.swift Scripts/test_coreml_scorer.swift -o .rime-cache/test-coreml-scorer
          .rime-cache/test-coreml-scorer Core/Resources/Rime
          python3 Scripts/test_coreml_worker.py
          fi
      - name: Check native model, phonetic search and input state
        if: env.CLEAR_UI_HOTFIX != '1'
        run: |
          mkdir -p .build
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          url='https://raw.githubusercontent.com/gby2416341129-star/ClearKeyboard/5aa07f314dca525b990da1f8a65071ec17779eec/CRime/private/clear_sentence.h'
          reference=urllib.request.urlopen(url,timeout=60).read()
          assert hashlib.sha256(reference).hexdigest()=='3726b2b3eed6fca9c3eaff7bed37c3f50cd01cf74f5cb08a2f25ec402b14b9d6'
          Path('.build/native-reference.h').write_bytes(reference)
          reference=urllib.request.urlopen('https://raw.githubusercontent.com/gby2416341129-star/ClearKeyboard/c0f36661b34567af19d7ff52fa9562531eae6cdc/CRime/private/clear_sentence.h',timeout=60).read()
          assert hashlib.sha256(reference).hexdigest()=='696c07cdc5aaa2982b570e9fc6abebdd54d1cf6620e6698576f6f062bd3e1652'
          Path('.build/whole-reference.h').write_bytes(reference)
          fixture=json.loads(Path('Tests/Evaluation/candidate-score-parity.json').read_text())
          Path('.build/native-means.tsv').write_text(''.join(row['text']+'\t'+str(row['nativeMean'])+'\n' for row in fixture['rows']))
          PY
          python3 Scripts/test_exact_initials.py
          c++ -O3 -UNDEBUG -std=c++17 Scripts/test_exact_initials.cpp -o .build/test-exact-initials
          .build/test-exact-initials Core/Resources/Rime/clear-initials.idx .rime-cache/source/clear_pinyin.dict.yaml .build/corrupt-initials.tmp
          python3 Scripts/test_exact_channels.py
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_blind_spelling.cpp -o .build/test-blind-spelling
          .build/test-blind-spelling Core/Resources/Rime/clear-sentence.clm Core/Resources/Rime/clear-phonetic.tsv
          swiftc -O -parse-as-library Core/HostTextState.swift Scripts/test_candidate_context.swift -o .build/test-candidate-context
          .build/test-candidate-context
          swiftc -O -parse-as-library Core/Clipboard.swift Scripts/test_clipboard_observation.swift -o .build/test-clipboard-observation
          .build/test-clipboard-observation
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_native_bridge.cpp -o .build/test-bridge
          .build/test-bridge Core/Resources/Rime/clear-sentence.clm Core/Resources/Rime/clear-phonetic.tsv
          python3 Scripts/test_fast_engine.py
          python3 Scripts/test_character_coverage.py
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_native_batch.cpp -o .build/test-native-batch
          .build/test-native-batch Core/Resources/Rime/clear-sentence.clm .build/native-means.tsv
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_native_integer.cpp -o .build/test-native-integer
          .build/test-native-integer Core/Resources/Rime/clear-sentence.clm .build/native-means.tsv
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_whole_cache.cpp -o .build/test-whole-cache
          .build/test-whole-cache Core/Resources/Rime/clear-sentence.clm
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_sentence.cpp -o .build/test-sentence
          .build/test-sentence Core/Resources/Rime/clear-sentence.clm Core/Resources/Rime/clear-phonetic.tsv .build/corrupt-model.tmp
          c++ -O3 -UNDEBUG -std=c++17 -framework Accelerate Scripts/test_candidate_ranking.cpp -o .build/test-candidate-ranking
          .build/test-candidate-ranking Core/Resources/Rime/clear-sentence.clm Core/Resources/Rime/clear-phonetic.tsv
          swiftc -O -parse-as-library Core/LatestValue.swift Core/HostTextState.swift Scripts/test_frame_delivery.swift -o .build/test-frame-delivery
          .build/test-frame-delivery
          swiftc -O -parse-as-library Core/CandidateStripLayout.swift Scripts/test_candidate_layout.swift -o .build/test-candidate-layout
          .build/test-candidate-layout
          swiftc -O -parse-as-library Core/KeyboardShift.swift Scripts/test_keyboard_shift.swift -o .build/test-keyboard-shift
          .build/test-keyboard-shift
          swiftc -O -parse-as-library Core/Candidate.swift Core/Lexicon.swift Core/FuzzyPinyin.swift Core/Composition.swift Core/RepetitionModel.swift Scripts/test_repetition.swift -o .build/test-repetition
          .build/test-repetition Core/Resources/Rime/repetition-priors.tsv
      - name: Exercise all core input, clipboard, layout and state tests
        if: env.CLEAR_VISUAL_FAST != '1'
        id: core-tests
        continue-on-error: true
        run: swift test --configuration release --jobs 3
      - name: Check live composition and commit barriers with the UIKit controller
        if: env.CLEAR_VISUAL_FAST != '1'
        id: ui-tests
        continue-on-error: true
        run: bash Scripts/test-composition-proxy.sh
      - name: Record exact core and UI gate outcomes
        if: env.CLEAR_VISUAL_FAST != '1' && (always())
        env:
          CORE_TESTS_RESULT: ${{ steps.core-tests.outcome }}
          UI_TESTS_RESULT: ${{ steps.ui-tests.outcome }}
        run: |
          mkdir -p .build/GateOutcomes
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          report=dict(sourceCommit=os.environ['GITHUB_SHA'],workflowRunId=os.environ['GITHUB_RUN_ID'],
              coreOutcome=os.environ['CORE_TESTS_RESULT'],uiOutcome=os.environ['UI_TESTS_RESULT'])
          Path('.build/GateOutcomes/gate-outcomes.json').write_text(json.dumps(report,indent=2))
          print('EXACT_GATE_OUTCOMES '+json.dumps(report))
          PY
          xcrun xcresulttool get test-results summary --path .build/CompositionResults.xcresult > .build/GateOutcomes/runtime-summary.json || true
          xcrun xcresulttool get test-results summary --path .build/AppBottomResults.xcresult > .build/GateOutcomes/app-ui-summary.json || true
      - name: Return exact input and UI gate outcomes
        if: env.CLEAR_VISUAL_FAST != '1' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-gate-outcomes
          path: .build/GateOutcomes
          retention-days: 7
      - name: Require core and live UI checks before packaging
        if: env.CLEAR_VISUAL_FAST != '1' && (always())
        env:
          CORE_TESTS_RESULT: ${{ steps.core-tests.outcome }}
          UI_TESTS_RESULT: ${{ steps.ui-tests.outcome }}
        run: |
          test "$CORE_TESTS_RESULT" = success
          test "$UI_TESTS_RESULT" = success
      - name: Export synthetic keyboard visual review images
        id: visual-export
        if: env.CLEAR_VISUAL_FAST != '1' && always() && steps.ui-tests.outcome != 'skipped'
        run: |
          xcrun xcresulttool export attachments --path .build/CompositionResults.xcresult --output-path .build/KeyboardVisualReview
          xcrun xcresulttool export attachments --path .build/AppBottomResults.xcresult --output-path .build/KeyboardVisualReview/AppUI
      - name: Return keyboard visual review images
        if: env.CLEAR_VISUAL_FAST != '1' && (always() && steps.visual-export.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-keyboard-visual-review
          path: .build/KeyboardVisualReview
          if-no-files-found: error
          retention-days: 7
      - name: Verify focused interaction regressions
        run: bash Scripts/test-key-material.sh
      - name: Return focused key material review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-key-material-review
          path: .build/KeyMaterialReview
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve focused key material diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-key-material-diagnostic
          path: .build/KeyMaterialResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify App controls and actual installed keyboard settings/clipboard/gestures
        if: env.CLEAR_USER_DEVICE_REVIEW != '1'
        run: bash Scripts/test-current-round-ui.sh
      - name: Return current round actual extension evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-current-round-ui
          path: .build/CurrentRoundUI
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve current round UI failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-current-round-ui-diagnostic
          path: .build/CurrentRoundUIResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile repaired app and keyboard for iPhone, then package IPA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config = Path('Config/Project.xcconfig')
          source = config.read_text()
          assert 'MARKETING_VERSION = 0.1.17' in source
          assert 'CURRENT_PROJECT_VERSION = 20' in source
          source = source.replace('MARKETING_VERSION = 0.1.17', 'MARKETING_VERSION = 0.1.60')
          source = source.replace('CURRENT_PROJECT_VERSION = 20', 'CURRENT_PROJECT_VERSION = 63')
          config.write_text(source)
          PY
          bash Scripts/build-ipa.sh dist
      - name: Return unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-unsigned-IPA
          path: |
            dist/ClearKeyboard-unsigned.ipa
            dist/ClearKeyboard-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
