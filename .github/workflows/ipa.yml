name: Build unsigned iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      safari_ui:
        description: Run the optional Safari end-to-end regression
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate dictionaries and project resources
        run: python3 Scripts/validate_resources.py
      - name: Run offline engine regression tests
        run: swift test
      - name: Compile app and keyboard for iPhone, then package IPA
        run: bash Scripts/build-ipa.sh dist
      - name: Upload unsigned IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-unsigned-IPA
          path: |
            dist/ClearKeyboard-unsigned.ipa
            dist/ClearKeyboard-unsigned.ipa.sha256
            dist/ipa-validation.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Describe installation requirement
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'
          Device build and structural package checks passed. The artifact contains the app and keyboard extension.

          **This IPA is unsigned. Sign the app and embedded keyboard, with matching App Group entitlements, before installing on an iPhone.** No device testing has been performed by this workflow.
          NOTE
  native-runtime:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run native keyboard startup and candidate tests
        timeout-minutes: 18
        run: bash Scripts/test-native.sh
      - name: Exercise Safari keyboard position and input switching
        if: github.event_name == 'workflow_dispatch' && inputs.safari_ui
        timeout-minutes: 15
        run: bash Scripts/test-ui.sh ClearKeyboardUITests/AppUITests/testBSafariSearchAndMultilineKeepFullKeyboardRows
      - name: Upload native runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClearKeyboard-native-diagnostics
          path: |
            .build/native-tests.log
            .build/native-build.log
            .build/native-boot.log
            .build/NativeDiagnostics/result-summary.json
            .build/NativeDiagnostics/result-tests.json
            .build/NativeDiagnostics/runtime.log
            .build/native-devices.json
            .build/observer-reproduction.log
            .build/ui-tests.log
            .build/UITestDiagnostics/result-summary.json
            .build/UITestDiagnostics/runtime.log
          retention-days: 7
