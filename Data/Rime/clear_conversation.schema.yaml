schema:
  schema_id: clear_conversation
  name: Conversational phrase lookup
  version: '0.1.17'
engine:
  processors: [speller, selector, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [lua_filter@*clear_exact_words, uniquifier, lua_filter@*clear_span]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - erase/^[mn]$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^(zh|ch|sh).+$/$1/
translator:
  dictionary: clear_conversation
  prism: clear_conversation
  enable_user_dict: false
  enable_sentence: false
  max_sentences: 0
  enable_completion: false
  enable_word_completion: false
  enable_correction: false
  strict_spelling: false
  always_show_comments: true
  spelling_hints: 256
menu:
  page_size: 16
